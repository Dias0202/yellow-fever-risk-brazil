name: CI

# Lint and tests on every push and pull request. Tests that need the built panel
# (data/processed/) skip with an explicit reason, because the raw inputs are not
# redistributed in this repository; the algebraic and physical tests of the
# scenario module and the variable-group invariants always run.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt ruff==0.17.5

      - name: Lint
        run: ruff check .

      - name: Import every module
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib, pkgutil, yfvrisk
          for m in pkgutil.walk_packages(yfvrisk.__path__, "yfvrisk."):
              importlib.import_module(m.name)
          PY

      - name: Tests
        run: python -m pytest -q
