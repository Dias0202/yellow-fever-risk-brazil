name: Atualizar dados

# Reconstroi o painel a partir das fontes, roda os testes e abre um Pull Request
# com o diff. NUNCA faz merge sozinho: toda atualizacao de dados passa por revisao
# humana.
#
# O fluxo existe para pegar os modos de falha silenciosa mais comuns num painel
# montado a partir de fontes heterogeneas: arquivo baixado truncado, faixa de
# raster ausente, contagem de municipios que muda, fonte manual defasada.
#
# Pre-requisito: as exportacoes manuais (ver data/SOURCES.yml) precisam estar
# disponiveis em data/raw/ no runner. Sem elas, a reconstrucao falha de forma
# explicita no primeiro modulo de ingestao, e nenhum Pull Request e aberto. Por
# isso a execucao agendada so roda quando a variavel de repositorio
# PAINEL_DADOS_DISPONIVEIS for "true"; a execucao manual roda sempre.

on:
  schedule:
    # Todo dia 5, as 6h UTC. O SINAN e o PNI consolidam o mes anterior ate o dia 5.
    - cron: "0 6 5 * *"
  workflow_dispatch:
    inputs:
      forcar_reconstrucao_completa:
        description: "Reprocessar tambem as camadas pesadas (clima e floresta)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.event_name == 'workflow_dispatch' || vars.PAINEL_DADOS_DISPONIVEIS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Verificar integridade das fontes automatizadas
        run: |
          python -m yfvrisk.ingest.baixar_terraclimate --verificar
        env:
          PYTHONPATH: src

      # As fontes que exigem navegador (MapBiomas, WorldClim, TabNet, planilhas do
      # IBGE) nao podem ser baixadas aqui. Sao versionadas por checksum, e o passo
      # abaixo alerta quando estao defasadas em relacao ao periodo do painel.
      - name: Conferir defasagem das fontes manuais
        run: python src/yfvrisk/ingest/conferir_defasagem.py
        env:
          PYTHONPATH: src

      - name: Reconstruir o painel
        env:
          PYTHONPATH: src
          FORCAR_COMPLETA: ${{ inputs.forcar_reconstrucao_completa }}
        run: |
          python -m yfvrisk.ingest.municipios
          python -m yfvrisk.ingest.epi
          python -m yfvrisk.ingest.vacinacao
          python -m yfvrisk.ingest.populacao
          if [ "$FORCAR_COMPLETA" = "true" ]; then
            python -m yfvrisk.ingest.clima
            python -m yfvrisk.ingest.floresta
          fi

      - name: Rodar os testes do painel
        run: python -m pytest src/tests -q
        env:
          PYTHONPATH: src

      - name: Resumir o que mudou
        id: resumo
        run: python src/yfvrisk/ingest/resumir_mudancas.py >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONPATH: src

      - name: Abrir Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: dados/atualizacao-automatica
          title: "Atualizacao automatica do painel de dados"
          commit-message: "chore(data): rebuild panel from sources"
          body: |
            Reconstrucao automatica do painel de dados.

            Os testes em `src/tests` passaram. Antes de aprovar, conferir no
            resumo da execucao:

            - se a contagem de municipios continua em 5.570
            - se a prevalencia anual do desfecho se manteve na ordem de grandeza
            - se alguma fonte manual entrou em defasagem
            - se algum arquivo automatizado voltou truncado

            Este Pull Request nao deve ser mesclado sem revisao humana.
          labels: dados, automatico
          delete-branch: true
